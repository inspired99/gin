name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Run tests
        run: node --test tests/*.test.js

      # На сайт уходят только его файлы: без тестов, инструментов и исходников картинок
      - name: Collect site files
        run: |
          mkdir -p _site/assets
          cp index.html manifest.webmanifest config.js .nojekyll _site/
          cp -r css js _site/
          cp -r assets/bg assets/sprites assets/props _site/assets/
          cp assets/icon-*.png _site/assets/
          find _site/assets -name '*.json' -delete
          # по этому файлу открытое приложение узнает, что вышла новая версия
          echo "{\"v\":\"${GITHUB_SHA}\"}" > _site/version.json
          # версия внутри самого кода: хеш и время коммита, их видно внизу главной и в меню
          echo "export const BUILD = { v: '${GITHUB_SHA}', at: '$(git log -1 --format=%cI)' };" > _site/js/build.js

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
